services:
  payload:
    image: node:20-alpine
    working_dir: /home/node/app
    restart: unless-stopped

    ports:
      - "3111:3000"

    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules

    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payload
      DATABASE_PUBLIC_URL: postgresql://postgres:postgres@postgres:5432/payload

      PAYLOAD_SECRET: change-cette-cle-secrete-de-production

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "Installation de Git..."
        apk add --no-cache git

        if [ ! -d .git ]; then
          echo "Repository absent, clonage depuis GitHub..."

          rm -rf /tmp/payload

          git clone --depth 1 \
            https://github.com/YllanSutter/payload.git \
            /tmp/payload

          echo "Copie du repository dans /home/node/app..."
          cp -a /tmp/payload/. /home/node/app/
        else
          echo "Repository déjà présent."
        fi

        echo "Activation de Corepack..."
        corepack enable

        echo "Installation de pnpm 10..."
        corepack prepare pnpm@10 --activate

        echo "Version de Node.js :"
        node --version

        echo "Version de pnpm :"
        pnpm --version

        echo "Installation des dépendances..."
        pnpm install

        echo "Lancement de l'application..."
        pnpm run dev:all-ln

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload

    volumes:
      - pgdata:/var/lib/postgresql/data

    ports:
      - "5455:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d payload
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  node_modules: